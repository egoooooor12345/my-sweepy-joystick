name: Build ZMK Firmware
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup ZMK Environment
      run: |
        git clone https://github.com/zmkfirmware/zmk.git zmk
        cd zmk
        west init -l .
        west update
        west zephyr-export
        echo "ZMK setup complete"
        
    - name: Build Left Half
      run: |
        cd zmk
        west build -b nice_nano_v2 -- -DSHIELD=sweepy_left -DZMK_CONFIG=$GITHUB_WORKSPACE/config
        cp build/zephyr/zmk.uf2 $GITHUB_WORKSPACE/left.uf2
        
    - name: Build Right Half
      run: |
        cd zmk
        west build -b nice_nano_v2 -- -DSHIELD=sweepy_right -DZMK_CONFIG=$GITHUB_WORKSPACE/config  
        cp build/zephyr/zmk.uf2 $GITHUB_WORKSPACE/right.uf2
        
    - name: Upload Firmware
      uses: actions/upload-artifact@v4
      with:
        name: firmware
        path: |
          left.uf2
          right.uf2
